<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>decisor-zero · etapa 05</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #8884; padding: .4rem .6rem; text-align: center; }
    input { width: 4.5rem; text-align: center; }
    button { margin-top: 1rem; padding: .5rem 1rem; cursor: pointer; }
    .ok { border-left: 4px solid #16a34a; background: #16a34a14; }
    .ruim { border-left: 4px solid #dc2626; background: #dc262614; }
    .veredito { padding: .5rem .75rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Etapa 05 — AHP</h1>
  <p>Edite a metade superior da matriz (a inferior é recíproca automática) e veja
     pesos e razão de consistência. Dica do capítulo: torne um julgamento cíclico
     (ex.: Preço 3× Área, Área 3× Bairro, mas Bairro 5× Preço) e veja o CR explodir.</p>
  <div id="matriz"></div>
  <button id="btn">Calcular prioridades</button>
  <div id="saida"></div>
  <script>
    let criterios, J;
    fetch("/api/caso-ancora").then(r => r.json()).then(c => {
      criterios = c.criterios; J = c.julgamentos; desenhar();
    });
    function desenhar() {
      const n = criterios.length;
      let html = `<table><tr><th></th>${criterios.map(c => `<th>${c}</th>`).join("")}</tr>`;
      for (let i = 0; i < n; i++) {
        html += `<tr><th>${criterios[i]}</th>`;
        for (let j = 0; j < n; j++) {
          html += i < j
            ? `<td><input type="number" step="any" min="0.111" max="9" value="${J[i][j]}"
                 data-i="${i}" data-j="${j}"></td>`
            : `<td>${i === j ? "1" : (1 / J[j][i]).toFixed(3)}</td>`;
        }
        html += `</tr>`;
      }
      document.getElementById("matriz").innerHTML = html + `</table>`;
    }
    document.getElementById("btn").onclick = async () => {
      document.querySelectorAll("input[data-i]").forEach(el => {
        const i = +el.dataset.i, j = +el.dataset.j, v = parseFloat(el.value);
        J[i][j] = v; J[j][i] = 1 / v;
      });
      desenhar();
      const r = await fetch("/api/ahp/prioridades", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ julgamentos: J }),
      });
      const corpo = await r.json();
      if (!r.ok) {
        document.getElementById("saida").innerHTML =
          `<div class="veredito ruim">${corpo.detail}</div>`; return;
      }
      document.getElementById("saida").innerHTML =
        `<table><tr>${criterios.map(c => `<th>${c}</th>`).join("")}</tr>
         <tr>${corpo.pesos.map(w => `<td>${w.toFixed(4)}</td>`).join("")}</tr></table>
         <div class="veredito ${corpo.consistente ? "ok" : "ruim"}">
           λ<sub>max</sub> = ${corpo.lambda_max.toFixed(4)} · CR = ${corpo.cr.toFixed(4)} —
           ${corpo.consistente
             ? "consistente (CR ≤ 0,10): pesos utilizáveis no SAW do cap. 04."
             : "INCONSISTENTE (CR > 0,10): revise os julgamentos antes de usar (Saaty, 1980)."}
         </div>`;
    };
  </script>
</body>
</html>
